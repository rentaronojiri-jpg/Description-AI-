<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<title>案内図｜越谷市大沢 → 越谷市下間久里 深田</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@page{size:A3 landscape;margin:0}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;background:#e9edf1;font-family:"Yu Gothic UI","Meiryo",sans-serif;color:#1b2a3a}
.sheet{width:420mm;height:297mm;margin:0 auto;background:#fff;position:relative;overflow:hidden;}
header{background:linear-gradient(120deg,#0f2a47,#1d5a8a);color:#fff;padding:0 16mm;display:flex;align-items:center;justify-content:space-between;border-bottom:2.5mm solid #f2a900}
header h1{margin:0;font-size:15mm;letter-spacing:.6mm;font-weight:800}
header .sub{font-size:5mm;opacity:.85;margin-top:1.5mm}
.badge{text-align:right;font-size:5mm;line-height:1.5}
.badge b{font-size:11mm;color:#ffd35c}
.body{height:100%}
#map{height:100%;width:100%}
aside{padding:9mm 9mm;background:#f6f9fc;border-left:1px solid #cfd8e2;display:flex;flex-direction:column;gap:6mm}
.card{background:#fff;border-radius:3mm;padding:5mm 6mm;box-shadow:0 .6mm 2mm rgba(0,0,0,.12)}
.card .tag{display:inline-block;color:#fff;font-weight:700;font-size:4.2mm;padding:.8mm 4mm;border-radius:10mm;margin-bottom:2mm}
.s .tag{background:#1d7a46}.g .tag{background:#d6323b}
.card .ad{font-size:5.6mm;font-weight:800;line-height:1.35}
.card .nm{font-size:4.4mm;color:#51657a;margin-top:1mm}
h2{margin:0 0 2mm;font-size:5.4mm;border-left:2mm solid #f2a900;padding-left:3mm}
ol{margin:0;padding:0;list-style:none;counter-reset:n}
li{counter-increment:n;position:relative;padding:2.4mm 0 2.4mm 11mm;font-size:4.5mm;border-bottom:1px dashed #cfd8e2;line-height:1.4}
li:before{content:counter(n);position:absolute;left:0;top:2.4mm;width:7.5mm;height:7.5mm;border-radius:50%;background:#1d5a8a;color:#fff;text-align:center;line-height:7.5mm;font-weight:700;font-size:4.2mm}
li small{color:#6a7b8d;font-size:3.8mm}
.note{font-size:3.8mm;color:#6a7b8d;margin-top:auto}
footer{background:#0f2a47;color:#cfe0f0;font-size:3.8mm;padding:0 16mm;display:flex;align-items:center;justify-content:space-between}
.pin{display:flex;align-items:center;justify-content:center;width:11mm;height:11mm;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:.8mm solid #fff;box-shadow:0 1mm 2mm rgba(0,0,0,.4)}
.pin span{transform:rotate(45deg);color:#fff;font-weight:800;font-size:5mm}
.lbl{background:#fff;border:.5mm solid #333;border-radius:2mm;padding:3mm 6mm;font-weight:800;font-size:13mm;line-height:1.3;white-space:nowrap;box-shadow:0 .5mm 1.5mm rgba(0,0,0,.3)}
@media print{body{background:#fff}.sheet{margin:0}}
</style></head><body>
<div class="sheet">
<div class="body"><div id="map"></div>
</div>
</div>

}

pin(route[route.length-1],'#d6323b','G','目的地：深田<br>下間久里318-1','right:12mm;top:-20mm');
map.fitBounds(line.getBounds(),{paddingTopLeft:[150,150],paddingBottomRight:[500,170]});
L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);
