  /* ===== ページ（用紙）===== */
  .sheet {

  h1 {

    text-align: center;
    font-size: 19pt;
    letter-spacing: 6px;

    font-family: inherit;
    color: #000;
    border: none;
    border-bottom: 2px solid #000;

    padding: 0 0 4px 0;
  }

  }

  .sub-title input.editable {
    display: block;
    width: auto;
    max-width: 90%;
    margin: 0 auto;
    text-align: center;
    font-size: 11pt;

    padding-right: 10px;
  }

  table.scope textarea.editable { min-height: 40px; }

      padding: 0 0 4px 0 !important;
    }
  }
</style>

<script>
  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = (el.scrollHeight) + 'px';
  }
  document.querySelectorAll('textarea.editable').forEach(autoGrow);

  // 印刷時は用紙幅が画面表示時と変わり、折り返し位置がズレて文字が重なるため
  // 印刷直前・直後にテキストエリアの高さを再計算する
  window.addEventListener('beforeprint', () => {
    document.querySelectorAll('textarea.editable').forEach(autoGrow);
  });
  window.addEventListener('afterprint', () => {
    document.querySelectorAll('textarea.editable').forEach(autoGrow);
  });

  document.getElementById('btn-print').addEventListener('click', () => window.print());

  function syncValuesToAttributes() {
    document.querySelectorAll('input.editable').forEach(el => el.setAttribute('value', el.value));
    document.querySelectorAll('textarea.editable').forEach(el => { el.textContent = el.value; });
  }

  function suggestFileName() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    return `鉄骨階段修繕工事_工事内容ご説明資料_${y}${m}${d}.html`;
  }

  function saveAsHtmlFile() {
    syncValuesToAttributes();
    const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = suggestFileName();
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    const btn = document.getElementById('btn-save');
    const original = btn.textContent;
    btn.textContent = '✓ 保存しました';
    setTimeout(() => { btn.textContent = original; }, 1500);
  }

  document.getElementById('btn-save').addEventListener('click', saveAsHtmlFile);
</script>
